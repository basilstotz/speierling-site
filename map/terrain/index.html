<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js example</title>
  <style>
    body {
      padding: 0;
      margin: 0;
      background-color: #1b1b1b;
    }
    .centered {
	position: fixed;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
    }
    @keyframes terrain {
	from{ opacity: 0; }
	to {opacity:1; }

    }
    .container {
	border-style: solid;
	border-color: grey;
	background-color: grey;
	width: 900px;
	animation-name: terrain;
	animation-duration: 0.4s;
    }
  </style>
  <link rel="stylesheet" href="leaflet/leaflet.css">
  <link rel="stylesheet" href="leaflet-areaselect.css">
  <script src="leaflet/leaflet.js"></script>
  <script src="leaflet-areaselect.js"></script>
  <script src="p5/p5.min.js"></script>
  <!-- <script src="../addons/p5.sound.js"></script> -->

  <script src="sketch.js"></script>
</head>


<body id="body" onload="onLoad()">
  <main>
    <button onClick="starter()">start</button>
    
    <div class="centered container" id="container" style="display:none">
      <p onClick="stop()" style="margin:0px;margin-right:3px;text-align:right">&#10006;</p>
      <canvas id="terrain" width="900px" height="600px"></canvas>
    </div>
   
  </main>
  <script>
    function makeDisplay(){
	let container=document.createElement('div');
	container.setAttribute('id','container');
	container.setAttribute('class','centered container');
	container.setAttribute('style','display:none');
	let titel=document.createElement('p');
	titel.setAttribute('style','margin:0px;margin-right:3px;text-align:right');
	titel.innerHTML='&#10006;';
	titel.addEventListener('click', () => { container.setAttribute('style','display:none')} );
	let canvas=document.createElement('canvas');
	canvas.setAttribute('id','canvas');
	canvas.setAttrubute('style','width:900px;height:600px');
	container.appendChild(titel);
	container.appendChild(canvas);
	document.getElementById('body').appendChild(container);
    }
    
    function starter(){
	document.getElementById('container').setAttribute('style','display:block');
    }
    function stop(){
	document.getElementById('container').setAttribute('style','display:none');
    }
    //makeDisplay();
  </script>
  
</body>

</html>
